openapi: 3.0.3

info:
  title: Restful Booker - Training Contract
  version: 1.0.0

servers:
  - url: https://restful-booker.herokuapp.com

paths:
  /booking:
    get:
      summary: Get booking ids
      responses:
        '200':
          description: Booking id list

    post:
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        '200':
          description: Booking created
          content:
            application/json:
              schema:
                type: object
                required:
                  - bookingid
                  - booking
                properties:
                  bookingid:
                    type: integer
                  booking:
                    $ref: '#/components/schemas/BookingResponse'

  /booking/{id}:
    get:
      summary: Get a booking by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Booking details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '404':
          description: Booking not found

components:
  schemas:
    BookingRequest:
      type: object
      required:
        - firstname
        - lastname
        - totalprice
        - depositpaid
        - bookingdates
      properties:
        firstname:
          type: string
        lastname:
          type: string
        totalprice:
          type: integer
        depositpaid:
          type: boolean
        bookingdates:
          $ref: '#/components/schemas/BookingDates'
        additionalneeds:
          type: string

    BookingResponse:
      allOf:
        - $ref: '#/components/schemas/BookingRequest'

    BookingDates:
      type: object
      required:
        - checkin
        - checkout
      properties:
        checkin:
          type: string
          format: date
        checkout:
          type: string
          format: date
